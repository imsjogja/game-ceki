services:
  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Local-only fallback. Override this in .env before exposing the app.
      APP_SECRET: ${APP_SECRET:-change-this-local-secret}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      DATABASE_URL: mysql://${MYSQL_USER:-remiku}:${MYSQL_PASSWORD:-remiku}@db:3306/${MYSQL_DATABASE:-remiku}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OWNER_GOOGLE_SUB: ${OWNER_GOOGLE_SUB:-}
      VOICE_STUN_URLS: ${VOICE_STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      VOICE_TURN_URLS: ${VOICE_TURN_URLS:-}
      VOICE_TURN_SECRET: ${VOICE_TURN_SECRET:-}
      VOICE_TURN_TTL_SECONDS: ${VOICE_TURN_TTL_SECONDS:-600}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-remiku}
      MYSQL_USER: ${MYSQL_USER:-remiku}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-remiku}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-remiku-root-local}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - remiku_mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  remiku_mysql_data:
